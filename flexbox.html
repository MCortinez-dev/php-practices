<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html{
            font-size: 62,5%;
        }

        .contenedor{
            background-color: brown;
            width: 100%;
            display: flex;
            flex-direction: row;
            /* flex-direction: column-reverse;
            flex-direction: row-reverse;
            flex-direction: column;
            justify-content: center;
            justify-content: flex-start;
            justify-content: space-between; */
            justify-content: space-evenly;
        }

        .item{
            width: 50px;
            height: 50px;
            /* font-size: 20px; */
            font-size: 5rem;
        }

        .item-1{
            position: absolute;
            z-index: 10;
            top: 20px;
            left: 20px;
            background-color: aqua;
            color: red;
        }

        .item-2{
            position: absolute;
            z-index: 15;
            top: 50px;
            left: 50px;
            background-color: bisque;
            color: brown;
        }

        .item-3{
            position: absolute;
            z-index: 20;
            top: 70px;
            left: 70px;
            background-color: violet;
            color: white;
            /* order: -1; */
        }

        .item-4{
            background-color: aquamarine;
            color: black;
        }

        .item-5{
            background-color: burlywood;
            color: blueviolet;
        }

    </style>
</head>


<body>

    <section class="contenedor">
        <article class="item-1">1</article>
        <article class="item-2">2</article>
        <article class="item-3">3</article>
        <article class="item-4">4</article>
        <article class="item-5">5</article>
    </section>

</body>

</html>
